[package]
name = "swiss-rb-knife"
version = "0.7.0"
license = "AGPL-3.0-or-later"
description = "A Multi-Tool Application."
authors = ["Railblade"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rb_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the formats Image CCR actually accepts, and `rayon` so its parallel
# resize/encode paths are unchanged. The default feature set adds AVIF, OpenEXR,
# DDS, HDR, farbfeld, ICO, PNM, QOI and TGA decoders, none of which anything can
# reach: every decode in image_ccr.rs goes through open_image_limited(), which
# picks the format from the file EXTENSION rather than sniffing the content, and
# the extension lists (RESIZE_SUPPORTED_EXTS, and the dialog filters in
# image-ccr.ts) admit only these seven. Turning them off drops ravif, rav1e, exr
# and their transitive trees, which is a smaller binary, a faster build, and
# several thousand lines of image parser that no longer ship at all.
#
# A format added to those extension lists MUST be added here too, or it decodes
# to "unsupported format" at runtime rather than failing to compile. The
# every_accepted_format_actually_round_trips test in image_ccr.rs is what makes
# that a test failure instead of a bug report.
image = { version = "0.25", default-features = false, features = [
    "rayon",
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
# SQLite, bundled: the C source is compiled in, so nothing has to be installed
# on a build machine and nothing has to be installed on a user's. This is the
# store for the tools whose records grow without bound (Kanban, Time Tracker,
# Game Stats). Settings stay JSON, because a preferences file is read once at
# startup and gains nothing from a database.
#
# The ENCRYPTED build of SQLite (SQLCipher) is deliberately not used: it needs
# OpenSSL, which needs a Perl toolchain to build on Windows, and the one tool in
# this app that genuinely needs encryption (Budget) is also the one whose data
# is bounded and therefore fine as an encrypted JSON file.
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"
# Update check — one blocking GET to the GitHub Releases API (see lib.rs
# check_for_updates). Pinned to 2.x for a stable API; default features bundle a
# rustls TLS stack, so there's no system OpenSSL dependency to satisfy on build.
ureq = "2"
# Windows session lock/unlock detection (see session_watch.rs) — needs the raw
# WTS session-notification API and a window subclass, neither of which Tauri's
# window API exposes. Windows-only; this whole app already targets Windows
# exclusively (elevated manifest, System32 paths throughout lib.rs).
# The agent gate (see src/agent_gate.rs) adds the Security, Pipes and
# Threading groups. It builds the named pipe's security descriptor by hand
# because the DEFAULT one is unusable here: this app runs elevated, a kernel
# object made by an elevated process carries that integrity level, and Windows
# will not let a medium-integrity AI agent write to it. Setting the descriptor
# is also what narrows the pipe to this one user account, where the default
# would have admitted Administrators and SYSTEM as well.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
# Whole-data-folder export and import (see src/data_archive.rs). Default
# features drag in bzip2, zstd, lzma, AES encryption and a time crate; a backup
# of this app's own folder needs exactly one compression method, and `deflate`
# is the one every unzip tool on earth already reads, so the archive stays
# openable by hand. That matters more than a few percent of size here: the
# whole point of shipping a plain .zip rather than a bespoke format is that the
# user can verify what is in it without this app.
#
# Pure Rust either way, so no C toolchain is added to the build.
zip = { version = "2", default-features = false, features = ["deflate"] }

# The MCP sidecar. Its own crate rather than a second [[bin]] here, and that is
# not tidiness: build.rs stamps this package's binaries with a
# requireAdministrator manifest, so a sidecar built here would raise a UAC
# prompt every single time an agent spawned it.
[workspace]
members = ["agent"]
