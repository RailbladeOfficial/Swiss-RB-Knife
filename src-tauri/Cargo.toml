[package]
name = "swiss-rb-knife"
version = "0.6.0"
license = "AGPL-3.0-or-later"
license-file = "LICENSE"
description = "A Multi-Tool Application."
authors = ["Railblade"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rb_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
zeroize = "1"
# Update check — one blocking GET to the GitHub Releases API (see lib.rs
# check_for_updates). Pinned to 2.x for a stable API; default features bundle a
# rustls TLS stack, so there's no system OpenSSL dependency to satisfy on build.
ureq = "2"
# Windows session lock/unlock detection (see session_watch.rs) — needs the raw
# WTS session-notification API and a window subclass, neither of which Tauri's
# window API exposes. Windows-only; this whole app already targets Windows
# exclusively (elevated manifest, System32 paths throughout lib.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
